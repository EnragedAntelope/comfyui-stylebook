name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate data integrity
        run: python tests/validate_data.py
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
      - name: Check generated frontend data is current
        run: python scripts/generate_js_data.py --check
      - name: Check frontend test fixtures are current
        run: python scripts/dump_frontend_fixtures.py --check
      - name: Check preview manifest is current
        run: python scripts/build_previews.py --check

  frontend:
    name: Frontend smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # hooks.mjs uses node:module's registerHooks(), added in 23.5.0 and
          # backported to the 22.15.0 LTS line. Pinning to the 24 LTS line
          # keeps a comfortable margin above that floor.
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run frontend smoke tests
        run: npm run test:frontend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "ruff==0.15.11"
      - name: Lint
        run: python -m ruff check .
