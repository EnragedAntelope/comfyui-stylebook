name: Publish to Comfy Registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read
  id-token: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    # Only publish from the canonical upstream repo, never from forks.
    if: github.repository_owner == 'EnragedAntelope'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The version guard below diffs against the previous commit.
          fetch-depth: 2
      - name: Check the version actually changed
        id: version
        shell: bash
        run: |
          # The `paths:` filter fires on ANY pyproject.toml edit -- a
          # keyword tweak, a reworded description, a dependency bump. Each
          # of those used to publish a release nobody asked for. Compare the
          # version field itself and skip when it has not moved.
          #
          # workflow_dispatch has no "before" commit, so it always
          # publishes: a human asked for it explicitly.
          read_version() { sed -n 's/^version *= *"\(.*\)"/\1/p' "$1" | head -1; }
          new=$(read_version pyproject.toml)
          if [ -z "$new" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run: publishing $new"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show HEAD^:pyproject.toml > /tmp/prev-pyproject.toml 2>/dev/null || true
          old=$(read_version /tmp/prev-pyproject.toml 2>/dev/null)
          if [ "$new" = "$old" ]; then
            echo "::notice::version is still $new; nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::version ${old:-none} -> $new"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Custom Node
        if: steps.version.outputs.changed == 'true'
        # Pinned to a commit, like every action in ci.yml. This step is the
        # one place REGISTRY_ACCESS_TOKEN is exposed, and a floating @main
        # hands whoever can push to that branch the ability to read it.
        # To move the pin: git ls-remote https://github.com/Comfy-Org/publish-node-action refs/heads/main
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
