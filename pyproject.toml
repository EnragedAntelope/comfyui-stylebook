[project]
name = "comfyui-stylebook"
version = "0.9.0"
description = "600+ visual styles for ComfyUI, every one with a rendered preview you can browse before you commit. Each ships a written description, a keyword list and a matching negative prompt. Plus 750+ artists with descriptors that work even when your model does not know the name, and modifiers for lighting, colour, era, finish and mood. Offline, zero dependencies."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["comfyui", "comfyui-nodes", "comfyui-custom-nodes", "prompt-engineering", "art-styles", "stable-diffusion", "flux", "sdxl", "text-to-image", "style", "artist", "modifier", "gallery", "preview"]
dependencies = []

[[project.authors]]
name = "EnragedAntelope"

[project.urls]
Repository = "https://github.com/EnragedAntelope/comfyui-stylebook"
"Bug Tracker" = "https://github.com/EnragedAntelope/comfyui-stylebook/issues"

[tool.comfy]
PublisherId = "enragedantelope"
DisplayName = "Stylebook"
requires-comfyui = ">=0.25.0"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
